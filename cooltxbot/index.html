<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script> 
    <script src='//libtl.com/sdk.js' data-zone='10390386' data-sdk='show_10390386'></script>
    
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center; 
            padding: 20px; 
            background-color: var(--tg-theme-bg-color, #ffffff); 
            color: var(--tg-theme-text-color, #000000); 
        }

        /* Contenedor de ejemplos visuales */
        .examples-box {
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f4);
            border-radius: 12px;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
            border: 1px solid rgba(0,0,0,0.1);
        }
        .example-line {
            margin-bottom: 10px;
            font-size: 15px;
        }
        .label {
            display: block;
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
            font-weight: bold;
        }

        button { 
            display: block; 
            width: 100%; 
            padding: 15px; 
            margin: 10px 0; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.7; }

        .ad-btn { background-color: #34a853; color: white; }
        .star-btn { background-color: #ffb300; color: black; }
        .use-bot-btn {
            background-color: #0088cc; 
            color: white;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3);
        }

        /* Ocultar botones premium por defecto */
        #premium-controls { display: none; }
    </style>
</head>
<body>
    <h2>Premium Styles</h2>
    
    <div class="examples-box">
        <div class="example-line">
            <span class="label">Fancy Style</span>
            𝓣𝓱𝓲𝓼 𝓲𝓼 𝓪 𝓹𝓻𝓮𝓶𝓲𝓾𝓶 𝓼𝓽𝔂𝓵𝓮
        </div>
        <div class="example-line">
            <span class="label">Gothic Style</span>
            𝔗𝔥𝔦𝔰 𝔦𝔰 𝔞 𝔭𝔯𝔢𝔪𝔦𝔲𝔪 𝔰𝔱𝔶𝔩𝔢
        </div>
        <div class="example-line">
            <span class="label">Double Struck</span>
            𝕋𝕙𝕚𝕤 𝕚𝕤 𝕒 𝕡𝕣𝕖𝕞𝕚𝕦𝕞 𝕤𝕥𝕪𝕝𝕖
        </div>
    </div>

    <p id="instruction-text">Choose how to unlock all styles:</p>
    
    <div id="premium-controls">
        <button class="ad-btn" onclick="watchAd()">📺 Watch Ad (Free)</button>
        <button class="star-btn" onclick="payStar()">⭐ Donate 1 Star</button>    
    </div>

    <button class="use-bot-btn" onclick="useBotDirectly()">✨ Use free style now!</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Detectar si estamos en Telegram
        window.onload = function() {
            // Si la plataforma no es 'unknown', estamos en la app de Telegram
            if (tg.platform !== 'unknown') {
                document.getElementById('premium-controls').style.display = 'block';
            } else {
                document.getElementById('instruction-text').innerHTML = 
                    "⚠️ <b>Access via Telegram</b> to unlock premium features.";
            }
        };

        function watchAd() {
            if (typeof show_10390386 === 'function') {
                show_10390386().then(() => {
                    // Popup nativo de éxito
                    tg.showPopup({
                        title: "Success!",
                        message: "All styles have been unlocked.",
                        buttons: [{type: "ok"}]
                    }, () => {
                        tg.sendData("ad_watched");
                        tg.close();
                    });
                }).catch((error) => {
                    console.error("Ad Error:", error);
                    tg.showAlert("Anuncio no disponible en este momento.");
                });
            } else {
                tg.showAlert("Cargando sistema de anuncios...");
            }
        }

        function payStar() {
            tg.sendData("pay_star");
            tg.close();
        }

        function useBotDirectly() {
            tg.switchInlineQuery("", ["users", "groups", "channels"]); 
            tg.close();
        }

        tg.ready();
    </script>
</body>
</html>
