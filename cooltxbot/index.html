<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Text Bot</title>
    <!-- SDK Oficial de Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #0088cc;
            --subtext-color: #aaaaaa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            text-align: center;
        }

        .container {
            max-width: 400px;
            width: 100%;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        p.description {
            font-size: 0.95rem;
            color: var(--subtext-color);
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .examples {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .example-item {
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .example-item:last-child {
            margin-bottom: 0;
        }

        .example-label {
            color: var(--subtext-color);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 2px;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(0, 136, 204, 0.3);
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .btn-primary:active {
            transform: scale(0.98);
            background-color: #0077b5;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">😎</div>
        <h1>Cool Text Bot</h1>
        <p class="description">Transform your normal messages into awesome stylized text instantly inside any Telegram chat.</p>
        
        <div class="examples">
            <div class="example-item">
                <span class="example-label">Input</span>
                <div>Hello World</div>
            </div>
            <div class="example-item" style="margin-top: 12px;">
                <span class="example-label">Styled Output</span>
                <div><b>🇭🇪🇱🇱🇴 🇼🇴🇷🇱🇩</b> / 贬𝔢𝔬 𝒲𝔬𝔯𝔡</div>
            </div>
        </div>

        <!-- Botón con la acción corregida -->
        <button id="openBotBtn" class="btn-primary">
            Open cooltxbot in Telegram
        </button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Inicializar el SDK de Telegram
            const tg = window.Telegram ? window.Telegram.WebApp : null;

            if (tg) {
                tg.ready();
                tg.expand();
            }

            const btn = document.getElementById('openBotBtn');

            btn.addEventListener('click', function () {
                // Vibración al presionar
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('medium');
                }

                if (tg) {
                    // Si está dentro de Telegram, ejecutamos la consulta inline nativa
                    if (typeof tg.switchInlineQuery === 'function') {
                        tg.switchInlineQuery(" ", ["users", "groups", "channels"]);
                    } 
                    else if (typeof tg.openTelegramLink === 'function') {
                        tg.openTelegramLink('https://t.me/cooltxbot');
                    } 
                    else {
                        window.open('https://t.me/cooltxbot', '_blank');
                    }
                } else {
                    // Si se abre desde un navegador normal fuera de Telegram
                    window.open('https://t.me/cooltxbot', '_blank');
                }
            });
        });
    </script>
</body>
</html>
