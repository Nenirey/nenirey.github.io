<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SDK Oficial de Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script> 
    <!-- RED DE ANUNCIOS 1: SDK LibTL / Adsterra para anuncios recompensados -->
    <script src='//libtl.com/sdk.js' data-zone='10390386' data-sdk='show_10390386'></script>
    
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center; 
            padding: 20px; 
            background-color: var(--tg-theme-bg-color, #ffffff); 
            color: var(--tg-theme-text-color, #000000); 
            max-width: 500px;
            margin: 0 auto;
        }

        .bot-logo { font-size: 50px; margin-bottom: 10px; }
        
        .description-box {
            margin-bottom: 25px;
        }
        .description-box p {
            font-size: 15px;
            line-height: 1.4;
            color: var(--tg-theme-hint-color, #666);
        }

        .examples-box {
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f4);
            border-radius: 12px;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
            border: 1px solid rgba(0,0,0,0.1);
        }
        .example-line { margin-bottom: 10px; font-size: 15px; }
        .label { display: block; font-size: 10px; color: #888; text-transform: uppercase; font-weight: bold; }

        button { 
            display: block; width: 100%; padding: 15px; margin: 10px 0; 
            border: none; border-radius: 8px; font-weight: bold; 
            cursor: pointer; font-size: 16px; transition: transform 0.1s;
        }
        button:active { transform: scale(0.98); }

        .ad-btn { background-color: #34a853; color: white; }
        .star-btn { background-color: #ffb300; color: black; }
        .use-bot-btn {
            background-color: #0088cc; color: white; margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3);
            text-decoration: none;
        }

        #premium-controls { display: none; }
        
        /* Contenedor centrado para el banner publicitario */
        .ad-banner-container {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 50px;
        }
    </style>
</head>
<body>
    <div class="bot-logo">✨</div>
    <div class="description-box">
        <h2 style="margin-bottom: 10px;">Cooltxbot</h2>
        <p>Transform your messages with <b>exclusive fonts and styles</b> directly in any Telegram chat. No installation required!</p>
    </div>
    
    <div class="examples-box">
        <div class="example-line">
            <span class="label">Fancy Style</span>
            𝓣𝓱𝓲𝓼 𝓲𝓼 𝓪 𝓹𝓻𝓮𝓶𝓲𝓾𝓶 𝓼𝓽𝔂𝓵𝓮
        </div>
        <div class="example-line">
            <span class="label">Gothic Style</span>
            𝔗𝔥𝔦𝔰 𝔦𝔰 𝔞 𝔭𝔯𝔢𝔪𝔦𝔲𝔪 𝔰𝔱𝔶𝔩𝔢
        </div>
        <div class="example-line">
            <span class="label">Double Struck</span>
            𝕋𝕙𝕚𝔰 𝕚𝕤 𝕒 𝕡𝕣𝕖𝕞𝕚𝕦𝔪 𝓼𝓽𝕞𝓵𝓮
        </div>
    </div>

    <p id="instruction-text" style="font-weight: bold;">Unlock all premium styles:</p>
    
    <div id="premium-controls">
        <button class="ad-btn" onclick="watchAd()">📺 Watch Ad (Unlock for Free)</button>
        <button class="star-btn" onclick="payStar()">⭐ Donate 1 Star</button>    
    </div>

    <button id="main-action-btn" class="use-bot-btn" onclick="handleMainAction()">✨ Use free styles now!</button>

    <!-- RED DE ANUNCIOS 2: Banner 320x50 de HighPerformanceFormat al final de la página -->
    <div class="ad-banner-container">
        <script type="text/javascript">
            atOptions = {
                'key' : '7a4af815def0e14dc22459b7cd950a19',
                'format' : 'iframe',
                'height' : 50,
                'width' : 320,
                'params' : {}
            };
        </script>
        <script type="text/javascript" src="https://www.highperformanceformat.com/7a4af815def0e14dc22459b7cd950a19/invoke.js"></script>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        const BOT_USERNAME = "Cooltxbot";
        
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const USER = tg ? tg.initDataUnsafe.user : null;

        window.onload = function() {
            if (tg && tg.platform !== 'unknown' && !USER) {
                document.getElementById('premium-controls').style.display = 'block';
            } else {
                document.getElementById('instruction-text').innerHTML = 
                    "Ready to upgrade your chat game?";
                document.getElementById('main-action-btn').innerHTML = "🚀 Open Cooltxbot in Telegram";
            }
        };

        // ACCIÓN DEL BOTÓN PRINCIPAL
        function handleMainAction() {
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            if (tg) {
                if (typeof tg.switchInlineQuery === 'function') {
                    // Abre el selector de chats de Telegram para usar el modo inline
                    tg.switchInlineQuery(" ", ["users", "groups", "channels"]);
                } 
                else if (typeof tg.openTelegramLink === 'function') {
                    tg.openTelegramLink(`https://t.me/${BOT_USERNAME}`);
                } 
                else {
                    window.open(`https://t.me/${BOT_USERNAME}`, '_blank');
                }
            } else {
                window.open(`https://t.me/${BOT_USERNAME}`, '_blank');
            }
        }

        // ACCIÓN DE ANUNCIO RECOMPENSADO (Adsterra / LibTL)
        function watchAd() {
            if (typeof show_10390386 === 'function') {
                show_10390386().then(() => {
                    if (tg && typeof tg.showPopup === 'function') {
                        tg.showPopup({
                            title: "Success!",
                            message: "All styles have been unlocked. Enjoy!",
                            buttons: [{type: "ok"}]
                        }, () => {
                            if (typeof tg.sendData === 'function') tg.sendData("ad_watched");
                            tg.close();
                        });
                    } else {
                        alert("All styles have been unlocked. Enjoy!");
                    }
                }).catch((error) => {
                    console.error("Ad Error:", error);
                    if (tg && typeof tg.showAlert === 'function') {
                        tg.showAlert("Ad not available. Please try again in a few minutes.");
                    } else {
                        alert("Ad not available. Please try again in a few minutes.");
                    }
                });
            } else {
                if (tg && typeof tg.showAlert === 'function') {
                    tg.showAlert("Loading ad system...");
                } else {
                    alert("Loading ad system...");
                }
            }
        }

        // ACCIÓN DE PAGO CON ESTRELLAS
        function payStar() {
            if (tg) {
                if (typeof tg.sendData === 'function') tg.sendData("pay_star");
                tg.close();
            }
        }
    </script>
</body>
</html>
