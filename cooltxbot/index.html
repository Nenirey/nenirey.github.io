<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>    
    <script>
        
    const tg = window.Telegram.WebApp;
    tg.expand();

    // 1. Declaramos la variable fuera para que todas las funciones la vean
    let AdController = null;

    // 2. Función que inicializa Adsgram SOLO cuando el SDK esté listo
    function initAds() {
        if (window.Adsgram) {
            AdController = window.Adsgram.init({ blockId: "20149" });
            console.log("Adsgram inicializado correctamente");
        } else {
            console.error("El SDK de Adsgram no se ha cargado todavía");
        }
    }

    // 3. Llamamos a la inicialización inmediatamente
    initAds();

    async function watchAd() {
        // Verificamos si AdController existe antes de usarlo
        if (!AdController) {
            // Si falló antes, intentamos inicializar de nuevo
            initAds();
            if (!AdController) {
                alert("Error: El sistema de anuncios no está listo. Revisa tu conexión.");
                return;
            }
        }

        try {
            const result = await AdController.show();
            if (result.done) {
                tg.sendData("ad_watched");
                tg.close();
            }
        } catch (error) {
            if (error.error === 'ad_closed') {
                alert("Debes ver el anuncio completo.");
            } else {
                alert("Anuncio no disponible: " + error.description || error.error);
            }
            console.error(error);
        }
    }

    function payStar() {
        tg.sendData("pay_star");
        tg.close();
    }

    function useBotDirectly() {
    const tg = window.Telegram.WebApp;
    
    // El primer parámetro es el texto que aparecerá después de @tu_bot
    // Si lo dejas vacío "", solo pondrá el nombre del bot.
    tg.switchInlineQuery("", ["users", "groups", "channels"]); 
    
    // Opcionalmente cerramos la webapp (aunque switchInlineQuery suele hacerlo)
    tg.close();
    }
    </script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); }
        button { display: block; width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .ad-btn { background-color: #34a853; color: white; }
        .star-btn { background-color: #ffb300; color: black; }
        .use-bot-btn {
        background-color: #0088cc; /* Azul Telegram */
        color: white;
        margin-top: 20px;
        border-shadow: 0 4px 15px rgba(0, 136, 204, 0.3);
         }
    </style>
</head>
<body>
    <h2>Premium Styles</h2>
    <p>Choose how to unlock all styles:</p>
    
    <button class="ad-btn" onclick="watchAd()">📺 Watch Ad (Free)</button>
    <button class="star-btn" onclick="payStar()">⭐ Donate 1 Star</button>    
    <button class="use-bot-btn" onclick="useBotDirectly()">✨ Use free style now!</button>
</body>
</html>
