<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); }
        button { display: block; width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .ad-btn { background-color: #34a853; color: white; }
        .star-btn { background-color: #ffb300; color: black; }
        .use-bot-btn {
        background-color: #0088cc; /* Azul Telegram */
        color: white;
        margin-top: 20px;
        border-shadow: 0 4px 15px rgba(0, 136, 204, 0.3);
         }
    </style>
</head>
<body>
    <h2>Premium Styles</h2>
    <p>Choose how to unlock all styles:</p>
    
    <button class="ad-btn" onclick="watchAd()">📺 Watch Ad (Free)</button>
    <button class="star-btn" onclick="payStar()">⭐ Donate 1 Star</button>

    <script src="https://adsgram.ai/sdk/v1/ad_gram_sdk.js"></script>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Inicializar Adsgram con tu Block ID
    const AdController = window.Adsgram.init({ blockId: "20149" });

    async function watchAd() {
        try {
            const result = await AdController.show();
            // El usuario terminó de ver el anuncio correctamente
            if (result.done) {
                tg.sendData("ad_watched");
                tg.close();
            }
        } catch (error) {
            // Manejo de errores (ej: no hay anuncios disponibles o el usuario cerró)
            if (error.error === 'ad_closed') {
                alert("Debes ver el anuncio completo para desbloquear los estilos.");
            } else {
                alert("Error al cargar el anuncio. Intenta más tarde.");
            }
            console.error(error);
        }
    }

    function payStar() {
        tg.sendData("pay_star");
        tg.close();
    }

    function useBotDirectly() {
    const tg = window.Telegram.WebApp;
    
    // El primer parámetro es el texto que aparecerá después de @tu_bot
    // Si lo dejas vacío "", solo pondrá el nombre del bot.
    tg.switchInlineQuery("", ["users", "groups", "channels"]); 
    
    // Opcionalmente cerramos la webapp (aunque switchInlineQuery suele hacerlo)
    tg.close();
    }
</script>
<button class="use-bot-btn" onclick="useBotDirectly()">✨ ¡Usar Estilos Ahora!</button>
</body>
</html>
