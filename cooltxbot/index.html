<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script> 
    <script src='//libtl.com/sdk.js' data-zone='10390386' data-sdk='show_10390386'></script>
    
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            padding: 20px; 
            background-color: var(--tg-theme-bg-color, #ffffff); 
            color: var(--tg-theme-text-color, #000000); 
        }
        button { 
            display: block; 
            width: 100%; 
            padding: 15px; 
            margin: 10px 0; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px;
        }
        .ad-btn { background-color: #34a853; color: white; }
        .star-btn { background-color: #ffb300; color: black; }
        .use-bot-btn {
            background-color: #0088cc; 
            color: white;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3);
        }
    </style>
</head>
<body>
    <h2>Premium Styles</h2>
    <p>Choose how to unlock all styles:</p>
    
    <button class="ad-btn" onclick="watchAd()">📺 Watch Ad (Free)</button>
    <button class="star-btn" onclick="payStar()">⭐ Donate 1 Star</button>    
    <button class="use-bot-btn" onclick="useBotDirectly()">✨ Use free style now!</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function watchAd() {
            // Verificamos si la función de Monetag existe
            if (typeof show_10390386 === 'function') {
                show_10390386().then(() => {
                    // El anuncio se mostró con éxito
                    tg.sendData("ad_watched");
                    tg.close();
                }).catch((error) => {
                    console.error("Error con el anuncio:", error);
                    alert("No se pudo cargar el anuncio. Inténtalo de nuevo más tarde.");
                });
            } else {
                alert("El sistema de anuncios se está cargando. Espera un segundo.");
            }
        }

        function payStar() {
            tg.sendData("pay_star");
            tg.close();
        }

        function useBotDirectly() {
            // Abre el bot en modo inline para usar los estilos básicos
            tg.switchInlineQuery("", ["users", "groups", "channels"]); 
            tg.close();
        }

        // Notificar a Telegram que la app está lista
        tg.ready();
    </script>
</body>
</html>
