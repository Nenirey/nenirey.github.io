    <script>
        
    const tg = window.Telegram.WebApp;
    tg.expand();      

    try {
         // Rewarded interstitial
         show_10390386().then(() => {
         // You need to add your user reward function here, which will be executed after the user watches the ad.
         // For more details, please refer to the detailed instructions.
         tg.sendData("ad_watched");
         tg.close();
         })

     }
     } catch (error) {
            if (error.error === 'ad_closed') {
                alert("Debes ver el anuncio completo.");
            } else {
                alert("Anuncio no disponible: " + error.description || error.error);

    function useBotDirectly() {
    const tg = window.Telegram.WebApp;
    
    // El primer parámetro es el texto que aparecerá después de @tu_bot
    // Si lo dejas vacío "", solo pondrá el nombre del bot.
    tg.switchInlineQuery("", ["users", "groups", "channels"]); 
    
    // Opcionalmente cerramos la webapp (aunque switchInlineQuery suele hacerlo)
    tg.close();
    }
