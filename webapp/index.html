<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="shortcut icon" type="image/svg" href="../static/telegram.svg">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
    <link rel="stylesheet" href="index.css"/>
    <title>Proceso KYC</title>
    <script>
        function handleFormData() {
            var name = document.getElementById("name").value;
            var date = document.getElementById("date").value;
            var email = document.getElementById("email").value;
            var ci = document.getElementById("ci").value;
            var addr = document.getElementById("addr").value
            var phone = document.getElementById("phone").value
            /*
            fetch('/demoFormResponse', {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    name: name, date: date,
                    email: email, country: country,
                    initData: window.Telegram.WebApp.initData
                })
            }
            )*/
            datos = JSON.stringify({
                    name: name, date: date,
                    email: email, ci: ci, addr: addr, phone: phone, 
                    initData: window.Telegram.WebApp.initData
                });
            telegram.sendData(datos);
            
        }
        function setThemeClass() {
          document.documentElement.className = Telegram.WebApp.colorScheme;
        }
        Telegram.WebApp.onEvent('themeChanged', setThemeClass);
        setThemeClass();
        function evalcode() {
          try{
          window.alert(eval(document.getElementById("code").value))
          }catch(e){
            window.alert(e)
          }
        }
    </script>
</head>

<body>

    <div class="container">
        <div class="forms">
            <div class="form signup">
                <form onsubmit="handleFormData()">
                    <div class="input-field">
                        <input type="text" placeholder="Nombre completo" id="name" required>
                        <i class="uil uil-user"></i>
                    </div>
                    <div class="input-field">
                        <input type="text" placeholder="Correo electrónico" id="email" required>
                        <i class="uil uil-envelope icon"></i>
                    </div>
                    <div class="input-field">
                        <input placeholder="Fecha de nacimiento" type="text" onfocus="(this.type='date')" id="date" required>
                        <i class="uil uil-calendar-alt"></i>
                    </div>
                    <div class="input-field">
                        <input type="text" placeholder="Número de identidad" id="ci" required>
                        <i class="uil uil-user-square"></i>
                    </div>
                    <div class="input-field">
                        <input type="text" placeholder="Número de telefono" id="phone" required>
                        <i class="uil uil-phone"></i>
                    </div>
                    <div class="input-field">
                        <input type="text" placeholder="Lugar de residencia" id="addr" required>
                        <i class="uil uil-location-point"></i>
                    </div>
                    <div class="input-field button">
                        <input type="submit" value="Continuar">
                    </div>
                    <!--
                    <div class="input-field">
                        <input type="text" placeholder="Enter your code" id="code">
                        <i class="uil uil-code"></i>
                    </div>
                    <div class="input-field button">
                        <input type="Button" value="Execute" onclick="evalcode()">
                    </div>
                    -->
                </form>
            </div>
        </div>
    </div>
    <script>
        const container = document.querySelector(".container");
        container.classList.add("active");
        const telegram = Telegram.WebApp;
        telegram.ready();
        //telegram.expand();
    </script>
</body>
</html>
