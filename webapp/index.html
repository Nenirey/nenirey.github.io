<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="shortcut icon" type="image/svg" href="../static/telegram.svg">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
    <link rel="stylesheet" href="index.css"/>
    <title>Proceso KYC</title>
    <script>
        // Maneja la recolección y envío de datos del formulario (ambas pestañas)
        function handleFormData(event) {
            if (event && event.preventDefault) event.preventDefault();

            const form = document.getElementById("kycForm");

            // Validar campos obligatorios en TODAS las pestañas
            const firstInvalid = validateAllRequired(form);
            if (firstInvalid) {
                // si hay un campo inválido, enfocarlo y cambiar de pestaña
                const tabEl = firstInvalid.closest('.tab');
                const tabNumber = tabEl ? tabEl.dataset.tab : "1";
                goToTab(tabNumber);
                // pequeño retardo para que el cambio de pestaña se renderice antes de scrollear/focus
                setTimeout(() => {
                    firstInvalid.classList.add('invalid');
                    firstInvalid.focus({preventScroll: false});
                    firstInvalid.scrollIntoView({behavior: 'smooth', block: 'center'});
                }, 120);

                const fieldName = firstInvalid.placeholder || firstInvalid.getAttribute('aria-label') || firstInvalid.id || 'campo requerido';
                const msg = "Falta completar: " + fieldName;
                showFormError(msg);
                return false;
            }

            // Si pasa la validación, ocultar mensaje y continuar
            hideFormError();

            const name = document.getElementById("name").value;
            const date = document.getElementById("date").value;
            const ci = document.getElementById("ci").value;
            const addr = document.getElementById("addr").value;
            const phone = document.getElementById("phone").value;
            const phone2 = document.getElementById("phone2").value;

            // Campos adicionales en la segunda pestaña
            const card1 = document.getElementById("card1").value;
            const card2 = document.getElementById("card2").value;
            const card3 = document.getElementById("card3").value;
            const wallet1 = document.getElementById("wallet1").value;
            const wallet2 = document.getElementById("wallet2").value;
            const wallet3 = document.getElementById("wallet3").value;

            // Campos adicionales en la tercera pestaña
            const tlg2 = document.getElementById("tlg2").value;
            const tlg3 = document.getElementById("tlg3").value;
            const fcb = document.getElementById("fcb").value;
            const inst = document.getElementById("inst").value;
            const twt = document.getElementById("twt").value;
            const other = document.getElementById("other").value;
            

            const datos = JSON.stringify({
                name: name,
                date: date,
                ci: ci,
                addr: addr,
                phone: phone,
                phone2: phone2,
                card1: card1,
                card2: card2,
                card3: card3,
                wallet1: wallet1,
                wallet2: wallet2,
                wallet3: wallet3,
                tlg2: tlg2,
                tlg3: tlg3,
                fcb: fcb, 
                inst: inst,
                twt: twt,
                other: other,
                initData: window.Telegram?.WebApp?.initData || null
            });

            // Enviar datos al bot / WebApp
            try {
                // Usar la API de Telegram WebApp para enviar datos
                Telegram.WebApp.sendData(datos);
            } catch (e) {
                // Fallback: si no está disponible, mostrar en consola
                console.error("Error sending data:", e);
                alert("No se pudo enviar la información a Telegram WebApp. Revisa la consola.");
            }
        }

        // Valida todos los inputs required, marca los botones de pestaña que contienen errores
        function validateAllRequired(form) {
            // limpiar marcas previas
            document.querySelectorAll('.tab-btn').forEach(btn => btn.removeAttribute('data-has-error'));
            const requiredInputs = Array.from(form.querySelectorAll('input[required]'));
            let firstInvalid = null;
            requiredInputs.forEach(input => {
                input.classList.remove('invalid');
                const empty = !input.value || input.value.trim() === '';
                if (empty && !firstInvalid) {
                    firstInvalid = input;
                }
                if (empty) {
                    // marcar la pestaña que contiene este input como con error
                    const tab = input.closest('.tab');
                    if (tab && tab.dataset.tab) {
                        const btn = document.querySelector('.tab-btn[data-tab="' + tab.dataset.tab + '"]');
                        if (btn) btn.setAttribute('data-has-error', 'true');
                    }
                }
            });
            return firstInvalid;
        }

        function showFormError(msg) {
            const el = document.getElementById('formError');
            if (el) {
                el.textContent = msg;
                el.classList.add('visible');
            }
            // Preferir usar las notificaciones nativas de Telegram si están disponibles
            try {
                if (window.Telegram?.WebApp?.showAlert) {
                    Telegram.WebApp.showAlert(msg); // si existe
                } else if (window.Telegram?.WebApp?.showPopup) {
                    Telegram.WebApp.showPopup({ message: msg });
                }
            } catch (e) {
                // si falla, ya se mostró el mensaje en el DOM; fallback final:
                // console.warn("No se pudo usar Telegram popup: ", e);
            }
        }

        function hideFormError() {
            const el = document.getElementById('formError');
            if (el) {
                el.classList.remove('visible');
                el.textContent = '';
            }
            document.querySelectorAll('.tab-btn').forEach(btn => btn.removeAttribute('data-has-error'));
        }

        // Quitar clase invalid al teclear
        document.addEventListener('input', function(e) {
            const tgt = e.target;
            if (tgt && tgt.tagName === 'INPUT') {
                if (tgt.value && tgt.value.trim() !== '') {
                    tgt.classList.remove('invalid');
                }
            }
        });

        // Manejo de tema de Telegram
        function setThemeClass() {
          try {
            document.documentElement.className = Telegram.WebApp.colorScheme;
          } catch(e){
            // si Telegram no está disponible, no hacemos nada
          }
        }
        try {
          Telegram.WebApp.onEvent('themeChanged', setThemeClass);
        } catch(e){}
        setThemeClass();

        // Cambio de pestañas (tabs)
        function goToTab(tabNumber) {
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(t => t.style.display = 'none');
            const active = document.querySelector('.tab[data-tab="' + tabNumber + '"]');
            if (active) active.style.display = 'block';

            // actualizar clases en los botones de pestaña visuales (si existen)
            document.querySelectorAll('.tab-btn').forEach(btn => {
                const btnTab = String(btn.dataset.tab || btn.getAttribute('data-tab'));
                const isActive = btnTab === String(tabNumber);
                btn.classList.toggle('active', isActive);
                btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
            });
        }

        // Eval (dejado comentado por seguridad)
        function evalcode() {
          try{
            window.alert(eval(document.getElementById("code").value))
          }catch(e){
            window.alert(e)
          }
        }
    </script>
</head>

<body>

    <div class="container">
        <div class="forms">
            <div class="form signup">
                <span class="title">Formulario KYC</span>

                <!-- Botones de pestaña -->
                <div class="tabs" role="tablist" aria-label="Páginas del formulario">
                  <div class="tab-btn active" onclick="goToTab(1)" role="tab" aria-selected="true" data-tab="1">Datos</div>
                  <div class="tab-btn" onclick="goToTab(2)" role="tab" aria-selected="false" data-tab="2">Medios</div>
                  <div class="tab-btn" onclick="goToTab(3)" role="tab" aria-selected="false" data-tab="3">Redes</div>  
                </div>

                <!-- Formulario único con secciones (pestañas) -->
                <form id="kycForm" onsubmit="handleFormData(event)">
                    <div id="formError" class="form-error" role="alert" aria-live="assertive"></div>

                    <!-- PESTAÑA 1 -->
                    <div class="tab" data-tab="1" style="display:block;">
                        <div class="input-field">
                            <input type="text" placeholder="Nombre completo" id="name" required aria-label="Nombre completo">
                            <i class="uil uil-user"></i>
                        </div>
                        <div class="input-field">
                            <input placeholder="Fecha de nacimiento" type="text" onfocus="(this.type='date')" id="date" required aria-label="Fecha de nacimiento">
                            <i class="uil uil-calendar-alt"></i>
                        </div>
                        <div class="input-field">
                            <input type="text" placeholder="Número de identidad" id="ci" required aria-label="Número de identidad">
                            <i class="uil uil-user-square"></i>
                        </div>
                        <div class="input-field">
                            <input type="text" placeholder="Número de telefono" id="phone" required aria-label="Número de telefono">
                            <i class="uil uil-phone"></i>
                        </div>
                        <div class="input-field">
                            <input type="text" placeholder="Telefono de familiar" id="phone2" required aria-label="Telefono de familiar">
                            <i class="uil uil-phone"></i>
                        </div>
                        <div class="input-field">
                            <input type="text" placeholder="Lugar de residencia" id="addr" required aria-label="Lugar de residencia">
                            <i class="uil uil-location-point"></i>
                        </div>

                        <div class="form-nav">
                            <div></div>
                            <button type="button" class="btn" onclick="goToTab(2)">Siguiente →</button>
                        </div>
                    </div>

                    <!-- PESTAÑA 2 (campos adicionales) -->
                    <div class="tab" data-tab="2" style="display:none;">
                        <div class="input-field">
                            <input type="text" placeholder="Tarjeta 1" id="card1" required aria-label="Tarjeta 1">
                            <i class="uil uil-credit-card"></i>
                        </div>
                        <div class="input-field">
                            <input type="text" placeholder="Tarjeta 2" id="card2" aria-label="Tarjeta 2">
                            <i class="uil uil-credit-card"></i>
                        </div>
                        <div class="input-field">
                            <input type="text" placeholder="Tarjeta 3" id="card3" aria-label="Tarjeta 3">
                            <i class="uil uil-credit-card"></i>
                        </div>
                        <div class="input-field">
                            <input type="text" placeholder="Wallet 1" id="wallet1" required aria-label="Wallet 1">
                            <i class="uil uil-wallet"></i>
                        </div>
                        <div class="input-field">
                            <input type="text" placeholder="Wallet 2" id="wallet2" aria-label="Wallet 2">
                            <i class="uil uil-wallet"></i>
                        </div>
                        <div class="input-field">
                            <input type="text" placeholder="Wallet 3" id="wallet3" aria-label="Wallet 3">
                            <i class="uil uil-wallet"></i>
                        </div>

                        <div class="form-nav">
                            <button type="button" class="btn secondary" onclick="goToTab(1)">← Atrás</button>
                            <button type="button" class="btn" onclick="goToTab(3)">Siguiente →</button>
                        </div>
                    </div>
                    <!-- PESTAÑA 3 (campos adicionales) -->
                    <div class="tab" data-tab="3" style="display:none;">
                        <div class="input-field">
                            <input type="text" placeholder="@Usuario Telegram 2" id="tlg2" aria-label="@Usuario Telegram 2">
                            <i class="uil uil-telegram"></i>
                        </div>
                        <div class="input-field">
                            <input type="text" placeholder="@Usuario Telegram 3" id="tlg3" aria-label="@Usuario Telegram 3">
                            <i class="uil uil-telegram"></i>
                        </div>
                        <div class="input-field">
                            <input type="text" placeholder="@Usuario de Facebook" id="fcb" aria-label="@Usuario de Facebook">
                            <i class="uil uil-facebook"></i>
                        </div>
                        <div class="input-field">
                            <input type="text" placeholder="@Usuario de Instagram" id="inst" aria-label="@Usuario de Instagram">
                            <i class="uil uil-instagram"></i>
                        </div>
                        <div class="input-field">
                            <input type="text" placeholder="@Usuario de Twitter(X)" id="twt" aria-label="@Usuario de Twitter">
                            <i class="uil uil-twitter"></i>
                        </div>
                        <div class="input-field">
                            <input type="text" placeholder="Otra red social" id="other" aria-label="Otra red social">
                            <i class="uil uil-at"></i>
                        </div>

                        <div class="form-nav">
                            <button type="button" class="btn secondary" onclick="goToTab(2)">← Atrás</button>
                            <input type="submit" class="btn" value="Enviar">
                        </div>
                    </div>
                    <!-- Campos comentados / herramientas de desarrollo -->
                    <!--
                    <div class="input-field">
                        <input type="text" placeholder="Enter your code" id="code">
                        <i class="uil uil-code"></i>
                    </div>
                    <div class="input-field button">
                        <input type="Button" value="Execute" onclick="evalcode()">
                    </div>
                    -->
                </form>
            </div>
        </div>
    </div>

    <script>
        // Inicialización Telegram WebApp y apertura visual
        const container = document.querySelector(".container");
        container.classList.add("active");
        try {
          const telegram = Telegram.WebApp;
          telegram.ready();
          // telegram.expand();
        } catch(e){
          console.warn("Telegram WebApp no disponible en este entorno:", e);
        }

        // Inicializar la visualización en la pestaña 1
        goToTab(1);
    </script>
</body>
    </html>
